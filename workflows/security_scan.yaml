# Legacy filename — same pipeline as security_scan_v2.yaml (v3.0 engine).

name: "apex_security_scan"
version: "3.0"
description: "Reconnaissance → module scan → LLM analysis → exploit chains → report"

inputs:
  target: ""
  modules: []
  config: {}

steps:
  - name: "reconnaissance"
    type: "task"
    task_type: "full_reconnaissance"
    payload:
      task_type: "full_reconnaissance"
      target: "${inputs.target}"
      api_hunt: "${inputs.config.api_hunt}"

  - name: "vulnerability_scanning"
    type: "task"
    dependencies: ["reconnaissance"]
    task_type: "module_scan"
    payload:
      task_type: "module_scan"
      target: "${inputs.target}"
      endpoints: "${steps.reconnaissance.results.endpoints}"
      modules: "${inputs.modules}"
      config: "${inputs.config}"

  - name: "analysis_phase"
    type: "task"
    dependencies: ["vulnerability_scanning"]
    task_type: "llm_analysis"
    payload:
      task_type: "llm_analysis"
      findings: "${steps.vulnerability_scanning.results.findings}"
      context: "${inputs.config}"

  - name: "exploit_chain_analysis"
    type: "task"
    dependencies: ["analysis_phase"]
    task_type: "exploit_chain_detection"
    payload:
      task_type: "exploit_chain_detection"
      findings: "${steps.vulnerability_scanning.results.findings}"
      target: "${inputs.target}"

  - name: "report_generation"
    type: "task"
    dependencies: ["exploit_chain_analysis"]
    task_type: "generate_report"
    payload:
      task_type: "generate_report"
      target: "${inputs.target}"
      findings: "${steps.analysis_phase.results.analyzed_findings}"
      exploit_chains: "${steps.exploit_chain_analysis.results.exploit_chains}"
      oast_data: {}
      config: "${inputs.config}"
